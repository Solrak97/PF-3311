skill_id: collect_modeled_user_samples
name: Collect Modeled User Samples
version: 0.1.0
description: >
  Runs a semi-structured interview with the modeled user to collect conversational
  samples for building a behavioral familiarity profile.

inputs:
  profile_id: string
  modeled_user_alias: string
  consent_confirmed: boolean

safety_rules:
  - Do not collect legal names unless explicitly necessary.
  - Do not ask for sensitive personal information.
  - Remind the user they may skip any question.
  - Store all data under profile_id, not real identity.
  - Do not claim this creates a perfect clone.

prompts:
  - id: daily_routine
    category: routine
    text: "Cuéntame brevemente cómo fue tu día."
  - id: after_work
    category: routine
    text: "¿Qué sueles hacer después de trabajar o estudiar?"
  - id: current_interest
    category: preferences
    text: "Háblame de algo que te guste mucho últimamente."
  - id: boring_tasks
    category: opinion
    text: "¿Qué opinas de tener que hacer trámites o tareas aburridas?"
  - id: good_news
    category: emotional_reaction
    text: "¿Cómo reaccionarías si un amigo te cuenta una buena noticia?"
  - id: annoying_situation
    category: emotional_reaction
    text: "¿Cómo reaccionarías si algo pequeño pero molesto arruina tu día?"
  - id: explain_to_friend
    category: explanation
    text: "Explícale a un amigo algo que sabes hacer bien."
  - id: advice
    category: advice
    text: "Dale un consejo casual a alguien que tuvo un día pesado."
  - id: banter
    category: casual_banter
    text: "Responde de forma casual a alguien que te cuenta algo gracioso."
  - id: closing
    category: closing
    text: "Despídete como normalmente cerrarías una conversación."

output_schema:
  profile_id: string
  modeled_user_alias: string
  created_at: string
  consent_confirmed: boolean
  samples:
    - prompt_id: string
      category: string
      prompt: string
      response: string
      timestamp: string

post_processing_targets:
  - tone
  - formality
  - common_phrases
  - filler_words
  - humor_style
  - response_length
  - emotional_expressiveness
  - follow_up_style
  - reassurance_style
  - topic_preferences
  - contextual_facts_safe_to_use
