[project]
name = "familiar-backend"
version = "0.1.0"
description = "Buddy brain: WS API, Ollama, STT/TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "edge-tts>=6.1.0",
  "faster-whisper>=1.0.0",
  "langgraph>=1.2.2",
  "langchain-core>=1.4.0",
  "miniaudio>=1.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
